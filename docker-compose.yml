version: '3.5'

services:
  postgres:
    container_name: chiron-ai-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langchain_app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432" # 仅本机；公网勿映射
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langchain_app"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: chiron-ai-redis
    image: redis:7.2-alpine # 复用本地已有镜像（原为 redis:7-alpine）
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    container_name: chiron-ai-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5 # 复用本地已有镜像（原为 v3.5.18，Milvus 兼容 3.5.x）
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: chiron-ai-milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z # 复用本地已有镜像（原为 RELEASE.2024-05-28T17-19-04Z，Milvus 官方 2.5 compose 同款版本）
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      # 宿主端口原为 9100/9101，2026-11-06 重启后落入 Windows 保留段 9081–9180（绑定报
      # "attempt to access a socket in a way forbidden"），故改到 9310/9311。
      # 容器内部仍走 minio:9000/9001，Milvus 经容器网络访问，不受宿主端口影响。
      - "127.0.0.1:19311:9001"
      - "127.0.0.1:19310:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 应用层对象存储（用户头像 / 会话附件 / 知识库文档与图片），与 Milvus 专用 MinIO 隔离
  minio-app:
    container_name: chiron-ai-app-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z # 复用本地已有镜像（原为 RELEASE.2024-05-28T17-19-04Z，Milvus 官方 2.5 compose 同款版本）
    environment:
      MINIO_ROOT_USER: ${MINIO_APP_ROOT_USER:?set MINIO_APP_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_APP_ROOT_PASSWORD:?set MINIO_APP_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9002:9000" # S3 API，仅本机；公网勿直接映射
      - "127.0.0.1:9003:9001" # Web 控制台
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio-app:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: chiron-ai-milvus-standalone
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      # 9091 同样落入 Windows 保留段 9081–9180（2026-11-06 重启后），改到 9391
      - "127.0.0.1:19391:9091"
    depends_on:
      - "etcd"
  attu:
    container_name: chiron-ai-milvus-attu
    image: zilliz/attu:v2.5.11  
    environment:
      - MILVUS_URL=standalone:19530  
      - PORT=3000
    ports:
      - "127.0.0.1:8080:3000"
    depends_on:
      # ★ 必须等 Milvus 健康再起：depends_on 的列表写法只保证"容器已创建"，
      #   而 Milvus 冷启动要 30-90s 加载元数据。原来 attu 抢跑 → 连不上 → 静默 Exited(1)。
      standalone:
        condition: service_healthy
    networks:
      - default  

networks:
  default:
    name: chiron-ai-milvus